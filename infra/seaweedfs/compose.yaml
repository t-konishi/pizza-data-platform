services:

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: pizza-seaweedfs

    command:
      - mini
      - -dir=/data

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-pizza-lake}

    ports:
      - "8333:8333"

    volumes:
      - seaweed-data:/data

    networks:
      - pizza-data-net

    restart: unless-stopped

volumes:
  seaweed-data:

networks:
  pizza-data-net:
    name: pizza-data-net
