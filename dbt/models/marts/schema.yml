version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_pizzas
    columns:
      - name: pizza_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fct_sales
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: pizza_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pizzas')
                field: pizza_id

      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: mart_daily_sales
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: order_count
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null
